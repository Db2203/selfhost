services:
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Only the API runs migrations on startup (see entrypoint.sh).
      RUN_MIGRATIONS: "1"
      HF_HOME: /home/appuser/.cache/huggingface
      TORCH_HOME: /home/appuser/.cache/torch
    volumes:
      - storage-data:/srv/storage
      - ml-cache:/home/appuser/.cache
      - ${LIBRARY_DIR:-./sample-library}:/srv/library:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./server
    command: ["arq", "app.worker.WorkerSettings"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HF_HOME: /home/appuser/.cache/huggingface
      TORCH_HOME: /home/appuser/.cache/torch
    volumes:
      - storage-data:/srv/storage
      - ml-cache:/home/appuser/.cache
      - ${LIBRARY_DIR:-./sample-library}:/srv/library:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photonest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photonest}
      POSTGRES_DB: ${POSTGRES_DB:-photonest}
    volumes:
      # PG18 images store data in a version-specific subdir and want the mount
      # at /var/lib/postgresql (mounting .../data is rejected as a stray dir).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photonest}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  storage-data:
  ml-cache:
