services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build: ./server
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - storage-data:/srv/storage
      - ${LIBRARY_DIR:-./sample-library}:/srv/library:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./server
    command: ["arq", "app.worker.WorkerSettings"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - storage-data:/srv/storage
      - ${LIBRARY_DIR:-./sample-library}:/srv/library:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photonest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photonest}
      POSTGRES_DB: ${POSTGRES_DB:-photonest}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photonest}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  storage-data:
